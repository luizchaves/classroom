  <script>
    let rawCalendarData = null;
    let targetWorkloadAulas = 120; // padrão: 120 aulas de 50 min
    let targetWorkloadMinutes = targetWorkloadAulas * 50;
    const initialOutlineView = new URLSearchParams(window.location.search).get('view');
    let currentOutlineView = ['compact', 'detailed', 'calendar'].includes(initialOutlineView) ? initialOutlineView : 'compact';
    let currentPeriodId = null;
    let scrollHashFrame = null;
    let suspendScrollHashUpdates = false;
    let pendingViewSwitchAnchorId = null;
    const calendarTooltipEl = document.getElementById('lesson-calendar-tooltip');
    const defaultSubjectFile = 'cstrc-jp-dw-2026.2.md';

    const weekdaysFullNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    const todayIsoDate = getTodayIsoDate();
    const monthNamesList = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];

    function getTodayIsoDate() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getMonthName(anoMes) {
      if (!anoMes) return '';
      const parts = anoMes.split('-');
      if (parts.length < 2) return anoMes;
      const year = parts[0];
      const monthIndex = parseInt(parts[1], 10) - 1;
      if (monthIndex >= 0 && monthIndex < 12) {
        return `${monthNamesList[monthIndex]} ${year}`;
      }
      return anoMes;
    }

    function getDayOfWeekName(dateStr) {
      if (!dateStr) return '';
      const [d, m, y] = dateStr.split('/');
      const dateObj = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
      return weekdaysFullNames[dateObj.getDay()];
    }

    function formatMinutesToHours(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      if (m === 0) return `${h}h`;
      return `${h}h ${m}min`;
    }

    function resetTargetWorkload() {
      targetWorkloadAulas = 120;
      targetWorkloadMinutes = targetWorkloadAulas * 50;
    }

    function setTargetWorkload(rawValue) {
      const clean = String(rawValue || '').trim().toLowerCase();
      const valueMatch = clean.match(/(\d+(?:[.,]\d+)?)/);
      if (!valueMatch) return;

      const value = parseFloat(valueMatch[1].replace(',', '.'));
      if (!Number.isFinite(value)) return;

      const suffix = clean.slice(valueMatch.index + valueMatch[0].length).trim();
      const isClassHour = /^(ha\b|h\/a\b|horas?[-\s]*aulas?\b|aulas?\b)/.test(suffix);

      if (isClassHour) {
        targetWorkloadAulas = Math.ceil(value);
        targetWorkloadMinutes = targetWorkloadAulas * 50;
      } else {
        targetWorkloadMinutes = Math.round(value * 60);
        targetWorkloadAulas = Math.ceil(targetWorkloadMinutes / 50);
      }
    }

    function updateQueryString(params, options = {}) {
      const currentUrl = new URL(window.location.href);

      Object.entries(params).forEach(([key, value]) => {
        if (value === null || value === undefined || value === '') {
          currentUrl.searchParams.delete(key);
        } else {
          currentUrl.searchParams.set(key, value);
        }
      });

      (options.deleteParams || []).forEach(key => currentUrl.searchParams.delete(key));
      if (options.clearHash) currentUrl.hash = '';

      window.history.pushState({ path: currentUrl.toString() }, '', currentUrl.toString());
    }

    function getSubjectSlug(subjectFile) {
      return String(subjectFile || '').trim().replace(/\.md$/i, '');
    }

    function getSubjectFileFromSlug(subjectValue) {
      const subjectSlug = getSubjectSlug(subjectValue);
      return subjectSlug ? `${subjectSlug}.md` : defaultSubjectFile;
    }

    function normalizeSubjectQuery(activeFile) {
      const currentUrl = new URL(window.location.href);
      const hasSubjectParam = currentUrl.searchParams.has('subject');
      const hasFileParam = currentUrl.searchParams.has('file');
      if (!hasSubjectParam && !hasFileParam) return;

      const subjectSlug = getSubjectSlug(activeFile);
      let changed = false;

      if (currentUrl.searchParams.get('subject') !== subjectSlug) {
        currentUrl.searchParams.set('subject', subjectSlug);
        changed = true;
      }

      if (hasFileParam) {
        currentUrl.searchParams.delete('file');
        changed = true;
      }

      if (changed) {
        window.history.replaceState({ path: currentUrl.toString() }, '', currentUrl.toString());
      }
    }

    function getSelectedSubjectFile() {
      const urlParams = new URLSearchParams(window.location.search);
      const paramSubject = urlParams.get('subject') || urlParams.get('file');
      if (paramSubject) {
        return getSubjectFileFromSlug(paramSubject);
      }

      if (window.location.hash) {
        const hashVal = window.location.hash.replace('#', '').trim();
        if (hashVal && !hashVal.startsWith('aula-') && !hashVal.startsWith('sem-aula-')) {
          return getSubjectFileFromSlug(hashVal);
        }
      }

      return null;
    }

    async function loadSubjectOutline(fileToLoad) {
      const urlParams = new URLSearchParams(window.location.search);
      const hasSubjectParam = urlParams.has('subject') || urlParams.has('file');
      const activeFile = fileToLoad || (hasSubjectParam ? getSelectedSubjectFile() : null);

      const subjectsView = document.getElementById('subjects-view');
      const stickyPageTools = document.querySelector('.sticky-page-tools');
      const outlineFeed = document.getElementById('outline-feed');
      const outlineCalendarContainer = document.getElementById('outline-calendar-container');
      const selectEl = document.getElementById('subject-select');

      const headerEl = document.querySelector('header');

      // Se nenhuma disciplina for especificada na URL, redireciona para a raiz (index.html):
      if (!activeFile && !hasSubjectParam && !window.location.hash) {
        window.location.replace('../index.html');
        return;
      }

      const fileToFetch = activeFile || defaultSubjectFile;
      normalizeSubjectQuery(fileToFetch);

      if (selectEl) {
        selectEl.value = getSubjectSlug(fileToFetch);
      }

      let rawMarkdown = '';

      // Smart URL resolution for GitHub Pages and relative paths
      const currentOrigin = window.location.origin;
      const currentPath = window.location.pathname;
      let dirPath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
      if (!dirPath.includes('/outline/')) {
        if (currentPath.includes('/outline')) {
          const pos = currentPath.indexOf('/outline');
          dirPath = currentPath.substring(0, pos + 8) + '/';
        }
      }

      const candidateUrls = [
        fileToFetch,
        `./${fileToFetch}`,
        `outline/${fileToFetch}`,
        new URL(fileToFetch, currentOrigin + dirPath).href
      ];

      for (const url of candidateUrls) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            const txt = await res.text();
            if (txt && txt.includes('---')) {
              rawMarkdown = txt;
              break;
            }
          }
        } catch (err) {
          console.warn(`Fetch candidate ${url} failed:`, err);
        }
      }



      if (rawMarkdown) {
        const calMatch = rawMarkdown.match(/calendario:\s*(.*)/i);
        let calFileName = '2026.2.json';
        if (calMatch) {
          const rawCal = calMatch[1].trim();
          calFileName = rawCal.split('/').pop();
        }
        await loadCalendarJSON(calFileName);
        parseOutlineData(rawMarkdown);
      }
    }

    async function loadCalendarJSON(calFileName = '2026.2.json') {
      const currentOrigin = window.location.origin;
      const currentPath = window.location.pathname;
      let dirPath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);

      const calendarCandidates = [
        `../calendar/${calFileName}`,
        `./calendar/${calFileName}`,
        `calendar/${calFileName}`,
        calFileName,
        new URL(`../calendar/${calFileName}`, currentOrigin + dirPath).href
      ];

      for (const url of calendarCandidates) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            rawCalendarData = await res.json();
            if (rawCalendarData) break;
          }
        } catch (err) {
          console.warn(`Calendar fetch candidate ${url} failed:`, err);
        }
      }
    }

    function normalizeIsoDate(value) {
      const clean = (value || '').trim();
      const isoMatch = clean.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (isoMatch) return clean;

      const brMatch = clean.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (brMatch) return `${brMatch[3]}-${brMatch[2]}-${brMatch[1]}`;

      const brShortMatch = clean.match(/^(\d{2})\/(\d{2})\/(\d{2})$/);
      if (brShortMatch) return `20${brShortMatch[3]}-${brShortMatch[2]}-${brShortMatch[1]}`;

      return null;
    }

    function formatIsoDate(isoDate) {
      const [y, m, d] = isoDate.split('-');
      return `${d}/${m}/${y}`;
    }

    function getIsoDateAsLocalTime(isoDate) {
      if (!isoDate) return null;
      const [year, month, day] = isoDate.split('-').map(Number);
      return new Date(year, month - 1, day).getTime();
    }

    function countsTowardWorkload(topic) {
      return !topic.isNoClass;
    }

    function isExtraClass(topic) {
      return countsTowardWorkload(topic) && topic.dateObj?.isExtra;
    }

    function getDeliveredClassSummary() {
      const deliveredDates = new Set();
      let deliveredAulas = 0;

      (window.topicsData || []).forEach(topic => {
        if (!countsTowardWorkload(topic) || !topic.dateObj?.isoDate || topic.dateObj.isoDate > todayIsoDate) return;

        deliveredDates.add(topic.dateObj.isoDate);
        deliveredAulas += topic.dateObj.aulas || 0;
      });

      return {
        days: deliveredDates.size,
        aulas: deliveredAulas
      };
    }

    function getDateProgressMeta() {
      const activeRange = getCalendarActiveRange();
      const startTime = getIsoDateAsLocalTime(activeRange.inicio);
      const endTime = getIsoDateAsLocalTime(activeRange.termino);
      const todayTime = getIsoDateAsLocalTime(todayIsoDate);
      const delivered = getDeliveredClassSummary();
      const deliveredText = `${delivered.days} dias • ${delivered.aulas} aulas`;

      if (!startTime || !endTime || !todayTime || endTime < startTime) {
        return {
          className: 'pill pill-progress-muted',
          text: `📈 Progresso: -- • ${deliveredText}`
        };
      }

      if (todayTime < startTime) {
        return {
          className: 'pill pill-progress-muted',
          text: `📈 Progresso: Não iniciado • ${deliveredText}`
        };
      }

      if (todayTime > endTime) {
        return {
          className: 'pill pill-progress-done',
          text: `📈 Progresso: 100% • ${deliveredText}`
        };
      }

      const percent = targetWorkloadAulas > 0
        ? Math.min(100, Math.max(0, Math.round((delivered.aulas / targetWorkloadAulas) * 100)))
        : 0;

      return {
        className: percent >= 100 ? 'pill pill-progress-done' : 'pill pill-progress',
        text: `📈 Progresso: ${percent}% • ${deliveredText}`
      };
    }

    function parseFrontMatterList(fmText, key) {
      const blockRegex = new RegExp(`(?:^|\\n)${key}:\\s*\\n([\\s\\S]*?)(?=\\n[a-z_]+:|$)`, 'i');
      const blockMatch = fmText.match(blockRegex);
      if (!blockMatch) return [];

      const items = [];
      let current = null;

      blockMatch[1].split('\n').forEach(rawLine => {
        const line = rawLine.trim();
        if (!line) return;

        if (line.startsWith('- ')) {
          if (current) items.push(current);
          current = {};
          const inlineField = line.slice(2).trim().match(/^([a-z_]+):\s*(.*)$/i);
          if (inlineField) {
            current[inlineField[1]] = inlineField[2].trim();
          }
          return;
        }

        const fieldMatch = line.match(/^([a-z_]+):\s*(.*)$/i);
        if (fieldMatch && current) {
          current[fieldMatch[1]] = fieldMatch[2].trim();
        }
      });

      if (current) items.push(current);
      return items;
    }

    function getActiveClassDays(schedule) {
      const dayMap = {
        'domingo': 0,
        'segunda': 1,
        'terça': 2,
        'terca': 2,
        'quarta': 3,
        'quinta': 4,
        'sexta': 5,
        'sábado': 6,
        'sabado': 6
      };

      return schedule.map(s => ({
        dayOfWeek: dayMap[s.dia.toLowerCase().replace('-feira', '')],
        aulas: s.aulas || 2
      })).filter(s => s.dayOfWeek !== undefined);
    }

    function getSelectedCalendarPeriod() {
      if (!rawCalendarData?.periodos || !currentPeriodId) return null;
      return rawCalendarData.periodos.find(p => String(p.id) === String(currentPeriodId)) || null;
    }

    function getCalendarActiveRange() {
      const selectedPeriod = getSelectedCalendarPeriod();

      return {
        inicio: selectedPeriod?.inicio
          || rawCalendarData?.metadata?.inicio
          || rawCalendarData?.inicio
          || (rawCalendarData?.periodos && rawCalendarData.periodos[0]?.inicio)
          || '2026-02-25',
        termino: selectedPeriod?.termino
          || rawCalendarData?.metadata?.termino
          || rawCalendarData?.termino
          || (rawCalendarData?.periodos && rawCalendarData.periodos[rawCalendarData.periodos.length - 1]?.termino)
          || null
      };
    }

    function getLetivoClassDates(schedule, skippedClassDates = new Set()) {
      const dates = [];
      if (!rawCalendarData || !rawCalendarData.meses || !schedule || schedule.length === 0) return dates;

      const activeDays = getActiveClassDays(schedule);

      const activeRange = getCalendarActiveRange();

      rawCalendarData.meses.forEach(m => {
        m.dias.forEach(d => {
          if (d.letivo && d.data >= activeRange.inicio && (!activeRange.termino || d.data <= activeRange.termino) && !skippedClassDates.has(d.data)) {
            const dt = new Date(d.data + 'T00:00:00');
            const dayOfWeek = dt.getDay();

            const matchedSchedule = activeDays.find(s => s.dayOfWeek === dayOfWeek);
            if (matchedSchedule) {
              const [y, month, dayNum] = d.data.split('-');
              const formattedDate = `${dayNum}/${month}/${y}`;
              const diaSemanaName = weekdaysFullNames[dayOfWeek];
              dates.push({
                isoDate: d.data,
                dateStr: formattedDate,
                diaSemana: diaSemanaName,
                aulas: matchedSchedule.aulas
              });
            }
          }
        });
      });
      return dates;
    }

    function getHolidayCategoryLabel(category) {
      const labels = {
        feriado_nacional: 'Feriado Nacional',
        feriado_estadual: 'Feriado Estadual',
        feriado_municipal: 'Feriado Municipal',
        feriado_ou_data_local: 'Feriado ou Data Local'
      };

      return labels[category] || 'Feriado';
    }

    function cleanHolidayDescription(description) {
      return (description || '').replace(/\s*\((?:F\.[NME]\.|P\.F\.)\)\s*$/i, '').trim();
    }

    function getHolidayNoClassEntries(schedule, ignoredDates = new Set()) {
      const entries = [];
      if (!rawCalendarData || !rawCalendarData.meses || !schedule || schedule.length === 0) return entries;

      const activeDays = getActiveClassDays(schedule);
      const activeRange = getCalendarActiveRange();

      rawCalendarData.meses.forEach(m => {
        m.dias.forEach(d => {
          if (d.data < activeRange.inicio || (activeRange.termino && d.data > activeRange.termino) || ignoredDates.has(d.data)) return;

          const holidayEvents = (d.eventos || []).filter(ev => ev.categoria && ev.categoria.includes('feriado'));
          if (holidayEvents.length === 0) return;

          const dt = new Date(d.data + 'T00:00:00');
          const dayOfWeek = dt.getDay();
          const matchedSchedule = activeDays.find(s => s.dayOfWeek === dayOfWeek);
          if (!matchedSchedule) return;

          const dateStr = formatIsoDate(d.data);
          entries.push({
            isoDate: d.data,
            dateStr,
            diaSemana: weekdaysFullNames[dayOfWeek],
            source: 'holiday',
            reason: holidayEvents
              .map(ev => `${getHolidayCategoryLabel(ev.categoria)}: ${cleanHolidayDescription(ev.descricao)}`)
              .join('; ')
          });
        });
      });

      return entries;
    }

    function parseOutlineData(rawMarkdown) {
      resetTargetWorkload();

      const fmMatch = rawMarkdown.match(/^---\s*\n([\s\S]*?)\n---/);
      let content = rawMarkdown;
      const parsedSchedule = [];
      const skippedClassDates = new Set();
      const noClassEntries = [];

      if (fmMatch) {
        content = rawMarkdown.replace(fmMatch[0], '');
        const fmText = fmMatch[1];
        
        const discMatch = fmText.match(/disciplina:\s*(.*)/);
        if (discMatch) document.getElementById('meta-disciplina').textContent = discMatch[1].trim();

        const cursoMatch = fmText.match(/curso:\s*(.*)/);
        if (cursoMatch) document.getElementById('meta-curso').textContent = cursoMatch[1].trim() + ' • IFPB Campus JP';

        const perMatch = fmText.match(/periodo:\s*(.*)/);
        if (perMatch) {
          currentPeriodId = perMatch[1].trim();
          document.getElementById('meta-periodo').textContent = currentPeriodId;
        } else {
          currentPeriodId = null;
        }

        const cargaMatch = fmText.match(/carga_horaria:\s*(.*)/);
        if (cargaMatch) {
          setTargetWorkload(cargaMatch[1].trim());
        }

        let profNames = [];
        const profListBlock = fmText.match(/(?:professor|professores):\s*\n((?:\s*-\s*.*\n?)+)/i);
        if (profListBlock) {
          profNames = profListBlock[1]
            .split('\n')
            .map(l => l.trim().replace(/^-\s*/, '').trim())
            .filter(Boolean);
        } else {
          const singleProfMatch = fmText.match(/(?:professor|professores):\s*(.*)/i);
          if (singleProfMatch && singleProfMatch[1].trim()) {
            profNames = singleProfMatch[1].trim().split(/\s+e\s+/i);
          }
        }

        if (profNames.length > 0) {
          const formattedNames = profNames.map(name => name.trim().startsWith('Prof.') ? name.trim() : `Prof. ${name.trim()}`);
          document.getElementById('meta-professor').textContent = '👨‍🏫 ' + formattedNames.join(' e ');
        }

        const horariosBlock = fmText.match(/horarios:\s*\n([\s\S]*?)(?=\n[a-z_]+:|\n---|$)/i);
        if (horariosBlock) {
          const hLines = horariosBlock[1].split('\n');
          const scheduleContainer = document.getElementById('schedule-items');
          scheduleContainer.innerHTML = '';

          let currentH = {};
          hLines.forEach(l => {
            const line = l.trim();
            if (line.startsWith('- dia:')) {
              if (currentH.dia) {
                renderScheduleItem(scheduleContainer, currentH);
                parsedSchedule.push(currentH);
              }
              currentH = { dia: line.replace('- dia:', '').trim() };
            } else if (line.startsWith('horario:')) {
              currentH.horario = line.replace('horario:', '').trim();
            } else if (line.startsWith('ambiente:')) {
              currentH.ambiente = line.replace('ambiente:', '').trim();
            } else if (line.startsWith('aulas:')) {
              currentH.aulas = parseInt(line.replace('aulas:', '').trim());
            }
          });
          if (currentH.dia) {
            renderScheduleItem(scheduleContainer, currentH);
            parsedSchedule.push(currentH);
          }
        }

        const noClassItems = parseFrontMatterList(fmText, 'sem_aula');
        noClassItems.forEach(item => {
          const isoDate = normalizeIsoDate(item.data);
          if (!isoDate) return;

          skippedClassDates.add(isoDate);
          const reason = item.motivo || item.descricao || 'Sem aula';
          const dateStr = formatIsoDate(isoDate);
          noClassEntries.push({
            isoDate,
            dateStr,
            diaSemana: getDayOfWeekName(dateStr),
            reason
          });
        });

      }

      getHolidayNoClassEntries(parsedSchedule, skippedClassDates).forEach(entry => {
        noClassEntries.push(entry);
      });

      const regDates = getLetivoClassDates(parsedSchedule, skippedClassDates);
      let regIdx = 0;

      const topicBlocks = content.split(/^##\s+/m).filter(b => b.trim().length > 0);
      const topicsData = [];

      topicBlocks.forEach((block) => {
        const lines = block.trim().split('\n');
        let rawTitleLine = lines[0].replace(/^#+\s*/, '').trim();
        if (rawTitleLine.startsWith('CSTRC JP') || rawTitleLine.startsWith('CSBES JP') || rawTitleLine.startsWith('CTII JP') || rawTitleLine.startsWith('#')) return;

        let cleanTitle = rawTitleLine;
        let explicitDate = null;
        let isExtra = false;
        let extraInfoStr = '';
        let aulasCount = 2;

        const dateInHeaderMatch = rawTitleLine.match(/(.*?)\s*\((.*?(\d{2}\/\d{2}\/\d{4}).*?)\)/);
        if (dateInHeaderMatch) {
          cleanTitle = dateInHeaderMatch[1].trim();
          explicitDate = dateInHeaderMatch[3];
          extraInfoStr = dateInHeaderMatch[2];
          isExtra = true;
          
          const aulasMatch = extraInfoStr.match(/(\d+)\s*aulas?/);
          if (aulasMatch) {
            aulasCount = parseInt(aulasMatch[1]);
          } else {
            aulasCount = 4;
          }
        }

        const resources = [];
        const bodyTexts = [];

        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (line.startsWith('-')) {
            const linkMatch = line.match(/-\s*\[(.*?)\]\((.*?)\)/);
            if (linkMatch) {
              const fullLabel = linkMatch[1];
              const url = linkMatch[2];
              let prefix = 'LINK';
              let text = fullLabel;

              if (fullLabel.includes(':')) {
                const parts = fullLabel.split(':');
                prefix = parts[0].trim();
                text = parts.slice(1).join(':').trim();
              }
              resources.push({ prefix, text, url });
            } else {
              const plainText = line.replace(/^-\s*/, '').trim();
              if (plainText) resources.push({ prefix: 'INFO', text: plainText, url: null });
            }
          } else if (line.length > 0 && !line.startsWith('#')) {
            bodyTexts.push(line);
          }
        }

        let dateObj = null;

        if (isExtra && explicitDate) {
          const realDayOfWeek = getDayOfWeekName(explicitDate);
          dateObj = {
            dateStr: explicitDate,
            isoDate: normalizeIsoDate(explicitDate),
            diaSemana: realDayOfWeek,
            isExtra: true,
            infoStr: extraInfoStr,
            aulas: aulasCount
          };
        } else if (regIdx < regDates.length) {
          dateObj = {
            isoDate: regDates[regIdx].isoDate,
            dateStr: regDates[regIdx].dateStr,
            diaSemana: regDates[regIdx].diaSemana,
            isExtra: false,
            aulas: regDates[regIdx].aulas
          };
          regIdx++;
        }

        topicsData.push({
          id: topicsData.length + 1,
          title: cleanTitle,
          dateObj: dateObj,
          resources: resources,
          bodyTexts: bodyTexts,
          sortOrder: topicsData.length
        });
      });

      const noClassTopics = noClassEntries.map((entry, index) => ({
        id: 0,
        title: entry.reason,
        isNoClass: true,
        dateObj: {
          isoDate: entry.isoDate,
          dateStr: entry.dateStr,
          diaSemana: entry.diaSemana,
          isNoClass: true,
          aulas: 0
        },
        resources: [],
        bodyTexts: [],
        sortOrder: -1000 + index
      }));

      const sortedTopics = topicsData.concat(noClassTopics).sort((a, b) => {
        const aDate = a.dateObj?.isoDate || '9999-12-31';
        const bDate = b.dateObj?.isoDate || '9999-12-31';
        if (aDate !== bDate) return aDate.localeCompare(bDate);
        return (a.sortOrder || 0) - (b.sortOrder || 0);
      });

      let lessonCounter = 0;
      sortedTopics.forEach((topic, index) => {
        topic.id = index + 1;
        if (!topic.isNoClass) {
          lessonCounter++;
          topic.lessonNumber = lessonCounter;
        }
      });

      window.topicsData = sortedTopics;
      renderTopics();
      setOutlineView(currentOutlineView, { updateUrl: false });
      const handledUrlAnchor = checkUrlAnchor();
      if (!handledUrlAnchor) {
        setTimeout(() => scrollFocusedLessonToTop(), 120);
      }
    }

    function renderScheduleItem(container, h) {
      const div = document.createElement('div');
      div.className = 'schedule-item';
      const clockStr = formatMinutesToHours((h.aulas || 2) * 50);
      const ambStr = h.ambiente ? `${h.ambiente} • ` : '';
      const shortDayMap = {
        'segunda': 'Seg',
        'terça': 'Ter',
        'terca': 'Ter',
        'quarta': 'Qua',
        'quinta': 'Qui',
        'sexta': 'Sex',
        'sábado': 'Sáb',
        'sabado': 'Sáb',
        'domingo': 'Dom'
      };
      const normalizedDay = h.dia.toLowerCase().replace('-feira', '');
      const shortDay = shortDayMap[normalizedDay] || h.dia.slice(0, 3);
      div.innerHTML = `
        <span class="schedule-main">
          <span class="schedule-day-full">${h.dia}-feira</span><span class="schedule-day-short">${shortDay}</span>: ${h.horario}
        </span>
        <span class="schedule-detail">${ambStr}${h.aulas} aulas (${clockStr})</span>
      `;
      container.appendChild(div);
    }

    function getTopicAnchorId(topic) {
      if (topic.isNoClass) return `sem-aula-${topic.dateObj.isoDate}`;
      const lessonNumStr = topic.lessonNumber ? String(topic.lessonNumber).padStart(2, '0') : '';
      return `aula-${lessonNumStr}`;
    }

    function getTopicLessonLabel(topic) {
      if (topic.isNoClass) return 'Aula --';
      const lessonNumStr = topic.lessonNumber ? String(topic.lessonNumber).padStart(2, '0') : '';
      return `Aula ${lessonNumStr}`;
    }

    function getTodayOrNextLessonTarget() {
      const upcomingTopics = (window.topicsData || [])
        .filter(topic => !topic.isNoClass && topic.dateObj?.isoDate && topic.dateObj.isoDate >= todayIsoDate);

      const todayTopic = upcomingTopics.find(topic => topic.dateObj.isoDate === todayIsoDate);
      const topic = todayTopic || upcomingTopics[0] || null;

      return topic ? {
        topic,
        isToday: topic.dateObj.isoDate === todayIsoDate
      } : null;
    }

    function updateJumpLessonButton() {
      const button = document.getElementById('jump-current-lesson-btn');
      const label = document.getElementById('jump-current-lesson-label');
      if (!button || !label) return;

      const target = getTodayOrNextLessonTarget();
      if (!target) {
        button.disabled = true;
        label.textContent = 'Sem próximas aulas';
        button.title = 'Não há aulas futuras cadastradas';
        return;
      }

      const lessonLabel = getTopicLessonLabel(target.topic);
      const prefix = target.isToday ? 'Hoje' : 'Próxima';
      button.disabled = false;
      label.textContent = `${prefix}: ${lessonLabel}`;
      button.title = `Ir para ${lessonLabel} - ${target.topic.title} (${target.topic.dateObj.dateStr})`;
    }

    function jumpToTodayOrNextLesson() {
      const target = getTodayOrNextLessonTarget();
      if (!target) return;

      const searchInput = document.getElementById('search-input');
      if (searchInput && searchInput.value.trim()) {
        searchInput.value = '';
        renderTopics();
      }

      if (currentOutlineView === 'calendar') {
        setOutlineView('compact');
      }

      const anchorId = getTopicAnchorId(target.topic);
      const currentUrl = new URL(window.location.href);
      currentUrl.hash = anchorId;
      window.history.pushState({}, '', currentUrl.toString());

      setTimeout(() => scrollToLesson(anchorId), 80);
    }

    function topicMatchesSearch(topic, searchQuery) {
      if (!searchQuery) return true;

      const matchesTitle = topic.title.toLowerCase().includes(searchQuery);
      const matchesDate = topic.dateObj ? (topic.dateObj.dateStr.includes(searchQuery) || topic.dateObj.diaSemana.toLowerCase().includes(searchQuery)) : false;
      const matchesResource = topic.resources.some(r => r.text.toLowerCase().includes(searchQuery) || r.prefix.toLowerCase().includes(searchQuery));
      const matchesBody = topic.bodyTexts ? topic.bodyTexts.some(b => b.toLowerCase().includes(searchQuery)) : false;

      return matchesTitle || matchesDate || matchesResource || matchesBody;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getTopicsSummary(topics) {
      return (topics || []).reduce((summary, topic) => {
        summary.count += 1;

        if (!topic.isNoClass) {
          const aulas = topic.dateObj?.aulas || 0;
          summary.days += 1;
          summary.aulas += aulas;

          if (isExtraClass(topic)) {
            summary.extraDays += 1;
            summary.extraAulas += aulas;
          }
        }

        return summary;
      }, {
        count: 0,
        days: 0,
        aulas: 0,
        extraDays: 0,
        extraAulas: 0
      });
    }

    function renderTopics() {
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const feed = document.getElementById('outline-feed');
      feed.innerHTML = '';

      const visibleTopics = window.topicsData.filter(topic => topicMatchesSearch(topic, searchQuery));
      const visibleSummary = getTopicsSummary(visibleTopics);
      const fullSummary = getTopicsSummary(window.topicsData);
      const hasTodayTopic = visibleTopics.some(topic => topic.dateObj?.isoDate === todayIsoDate);
      const nextLessonDateIso = visibleTopics
        .filter(topic => !topic.isNoClass && topic.dateObj?.isoDate && topic.dateObj.isoDate >= todayIsoDate)
        .map(topic => topic.dateObj.isoDate)
        .sort()[0] || null;

      visibleTopics.forEach((topic, index) => {
        const lessonAnchorId = getTopicAnchorId(topic);

        const titleLower = topic.title.toLowerCase();
        const titleNormalized = titleLower.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const isProject = titleLower.includes('projeto');
        const isGradedExercise = titleNormalized.includes('exercicio avaliativo');

        const card = document.createElement('div');
        card.className = 'topic-card';
        card.id = lessonAnchorId;
        if (topic.dateObj && topic.dateObj.isExtra) {
          card.classList.add('is-extra-card');
        }
        if (topic.isNoClass) {
          card.classList.add('is-no-class-card');
        }
        if (isProject) {
          card.classList.add('is-project-card');
        }

        // Toggle expand on click in Compact Mode (Accordion: one lesson expanded at a time)
        card.addEventListener('click', (e) => {
          if (feed.classList.contains('compact-mode') && !e.target.closest('a')) {
            const isExpanded = card.classList.contains('expanded');
            feed.querySelectorAll('.topic-card.expanded').forEach(c => c.classList.remove('expanded'));
            if (!isExpanded) {
              card.classList.add('expanded');
              updateLessonHash(lessonAnchorId);
              requestAnimationFrame(() => {
                scrollElementToPageTop(card, 'smooth');
              });
            }
          }
        });

        const header = document.createElement('div');
        header.className = 'topic-card-header';

        const lessonLinkLabel = getTopicLessonLabel(topic);
        let headerHtml = `
          <a href="#${lessonAnchorId}" class="topic-number-link ${topic.isNoClass ? 'no-class-link' : ''}" onclick="copyLessonLink(event, '${lessonAnchorId}')" title="Copiar link direto para ${lessonLinkLabel}">
            ${lessonLinkLabel}
          </a>
        `;

        headerHtml += `<h2 class="topic-title">${topic.title}</h2>`;

        if (topic.dateObj && topic.dateObj.isExtra) {
          headerHtml += `<span class="topic-date-badge badge-extra-label">⚡ AULA EXTRA</span>`;
        }

        if (isProject) {
          headerHtml += `<span class="topic-date-badge badge-project-label">🚀 PROJETO</span>`;
        }

        if (isGradedExercise) {
          headerHtml += `<span class="topic-date-badge badge-graded-label">📝 VALE NOTA</span>`;
        }

        if (topic.dateObj) {
          const dateBadgePastClass = topic.dateObj.isoDate && topic.dateObj.isoDate < todayIsoDate ? ' is-past-date' : '';
          const isFocusDate = topic.dateObj.isoDate
            && ((hasTodayTopic && topic.dateObj.isoDate === todayIsoDate)
              || (!hasTodayTopic && !topic.isNoClass && topic.dateObj.isoDate === nextLessonDateIso));
          const dateBadgeFocusClass = isFocusDate ? ' is-focus-date' : '';
          if (topic.isNoClass) {
            headerHtml += `<span class="topic-date-badge${dateBadgePastClass}${dateBadgeFocusClass}">📆 ${topic.dateObj.diaSemana}, ${topic.dateObj.dateStr} (0 aulas)</span>`;
          } else {
            headerHtml += `<span class="topic-date-badge${dateBadgePastClass}${dateBadgeFocusClass}">📆 ${topic.dateObj.diaSemana}, ${topic.dateObj.dateStr} (${topic.dateObj.aulas} aulas)</span>`;
          }
        }

        header.innerHTML = headerHtml;
        card.appendChild(header);

        // Render Lesson Body Text Content (if available)
        if (topic.bodyTexts && topic.bodyTexts.length > 0) {
          const bodyDiv = document.createElement('div');
          bodyDiv.className = 'topic-body-text';
          bodyDiv.innerHTML = topic.bodyTexts.map(t => `<p>${renderInlineLinks(t)}</p>`).join('');
          card.appendChild(bodyDiv);
        }

        // Render Resources List
        const resList = document.createElement('div');
        resList.className = 'resources-list';

        if (topic.resources.length === 0 && (!topic.bodyTexts || topic.bodyTexts.length === 0) && !topic.isNoClass) {
          resList.innerHTML = '<div class="no-resources">Nenhum recurso cadastrado para esta aula.</div>';
        } else if (topic.resources.length > 0) {
          topic.resources.forEach(r => {
            if (r.url) {
              const a = document.createElement('a');
              a.href = r.url;
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              
              let badgeClass = 'badge-dw';
              const pLower = r.prefix.toLowerCase();
              if (pLower.includes('github')) badgeClass = 'badge-github';
              else if (pLower.includes('braincheck') || pLower.includes('quiz')) badgeClass = 'badge-braincheck';
              else if (pLower.includes('exercício') || pLower.includes('exercicio')) badgeClass = 'badge-exercicio';
              else if (pLower.includes('padlet')) badgeClass = 'badge-padlet';
              else if (pLower.includes('figma')) badgeClass = 'badge-figma';
              else if (pLower.includes('medium')) badgeClass = 'badge-medium';

              a.className = `resource-link ${badgeClass}`;
              a.innerHTML = `<span class="badge-prefix">${r.prefix}</span> <span>${r.text}</span>`;
              resList.appendChild(a);
            } else {
              const div = document.createElement('div');
              div.className = 'resource-category-header';
              div.innerHTML = renderInlineMarkdown(r.text);
              resList.appendChild(div);
            }
          });
        }

        card.appendChild(resList);
        feed.appendChild(card);
      });

      // Update Header Badges dynamically
      const sumMinutes = fullSummary.aulas * 50;
      const sumClockStr = formatMinutesToHours(sumMinutes);

      const badgeAulas = document.getElementById('badge-aulas-ministradas');
      const badgeProgress = document.getElementById('badge-progresso-data');
      const badgeWorkloadDelta = document.getElementById('badge-carga-diferenca');
      const targetMinutes = targetWorkloadMinutes;
      const targetClockStr = formatMinutesToHours(targetMinutes);
      const diffMinutes = sumMinutes - targetMinutes;
      const extraSummary = fullSummary.extraAulas > 0
        ? ` • +${fullSummary.extraAulas} extras`
        : '';
      badgeAulas.className = diffMinutes < 0 ? 'pill pill-warning' : 'pill pill-success';
      badgeAulas.textContent = `🎓 Planejadas: ${fullSummary.aulas}/${targetWorkloadAulas} aulas (${sumClockStr}/${targetClockStr})${extraSummary}`;
      badgeWorkloadDelta.hidden = false;

      if (diffMinutes < 0) {
        const neededMinutes = Math.abs(diffMinutes);
        const neededAulas = Math.ceil(neededMinutes / 50);
        const neededClockStr = formatMinutesToHours(neededMinutes);
        const neededAulasLabel = neededAulas === 1 ? '1 aula' : `${neededAulas} aulas`;
        badgeWorkloadDelta.className = 'pill pill-warning';
        badgeWorkloadDelta.textContent = `Faltam: ${neededAulasLabel} (${neededClockStr})`;
      } else if (diffMinutes > 0) {
        const extraAulas = Math.ceil(diffMinutes / 50);
        const extraClockStr = formatMinutesToHours(diffMinutes);
        const extraAulasLabel = extraAulas === 1 ? '+1 aula' : `+${extraAulas} aulas`;
        badgeWorkloadDelta.className = 'pill pill-info';
        badgeWorkloadDelta.textContent = `Passou: ${extraAulasLabel} (${extraClockStr})`;
      } else {
        badgeWorkloadDelta.hidden = true;
        badgeWorkloadDelta.textContent = '';
      }

      const progressMeta = getDateProgressMeta();
      badgeProgress.className = progressMeta.className;
      badgeProgress.textContent = progressMeta.text;
      updateJumpLessonButton();

      const searchInfoPrefix = searchQuery ? 'Filtro' : 'Todos';

      document.getElementById('search-info-text').textContent =
        `${searchInfoPrefix}: ${visibleSummary.count} tópicos • ${visibleSummary.days} dias • ${visibleSummary.aulas} aulas`;

      if (currentOutlineView === 'calendar') {
        renderCalendarView();
      }

      updateStickyOffsets();

      // Initialize Lucide Icons if available
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function getCalendarMonthKeys(startIso, endIso) {
      const [startYear, startMonth] = startIso.split('-').map(Number);
      const [endYear, endMonth] = endIso.split('-').map(Number);
      const keys = [];
      let year = startYear;
      let month = startMonth;

      while (year < endYear || (year === endYear && month <= endMonth)) {
        keys.push(`${year}-${String(month).padStart(2, '0')}`);
        month++;
        if (month > 12) {
          month = 1;
          year++;
        }
      }

      return keys;
    }

    function getOutlineCalendarRange() {
      const datedTopics = (window.topicsData || [])
        .filter(topic => topic.dateObj?.isoDate)
        .map(topic => topic.dateObj.isoDate)
        .sort();

      const activeRange = getCalendarActiveRange();
      const inicio = activeRange?.inicio || datedTopics[0] || null;
      const termino = activeRange?.termino || datedTopics[datedTopics.length - 1] || inicio;

      if (!inicio || !termino) return null;
      return { inicio, termino };
    }

    function getCalendarMonthSummary(monthTopics) {
      const classDays = new Set();
      let classHours = 0;
      let noClassCount = 0;

      monthTopics.forEach(topic => {
        if (topic.isNoClass) {
          noClassCount++;
          return;
        }

        classDays.add(topic.dateObj.isoDate);
        classHours += topic.dateObj?.aulas || 0;
      });

      const parts = [];
      if (classDays.size > 0) parts.push(`${classDays.size} datas`);
      if (classHours > 0) parts.push(`${classHours} aulas`);
      if (noClassCount > 0) parts.push(`${noClassCount} sem aula`);
      return parts.length > 0 ? parts.join(' • ') : 'sem aulas';
    }

    function renderCalendarView() {
      const container = document.getElementById('outline-calendar-container');
      if (!container) return;
      hideLessonCalendarTooltip();

      const range = getOutlineCalendarRange();
      if (!range) {
        container.innerHTML = '';
        return;
      }

      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const visibleTopics = (window.topicsData || [])
        .filter(topic => topic.dateObj?.isoDate && topicMatchesSearch(topic, searchQuery));

      const topicsByDate = new Map();
      visibleTopics.forEach(topic => {
        const key = topic.dateObj.isoDate;
        if (!topicsByDate.has(key)) topicsByDate.set(key, []);
        topicsByDate.get(key).push(topic);
      });

      container.innerHTML = '';

      getCalendarMonthKeys(range.inicio, range.termino).forEach(monthKey => {
        const [year, month] = monthKey.split('-').map(Number);
        const monthIndex = month - 1;
        const firstDayOfWeek = new Date(year, monthIndex, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const monthTopics = visibleTopics.filter(topic => topic.dateObj.isoDate.startsWith(monthKey));

        const monthCard = document.createElement('section');
        monthCard.className = 'lesson-month-card';

        const monthHeader = document.createElement('div');
        monthHeader.className = 'lesson-month-header';
        monthHeader.innerHTML = `
          <div class="lesson-month-title">${getMonthName(monthKey)}</div>
          <div class="lesson-month-badge">${getCalendarMonthSummary(monthTopics)}</div>
        `;
        monthCard.appendChild(monthHeader);

        const weekdaysGrid = document.createElement('div');
        weekdaysGrid.className = 'lesson-weekdays-grid';
        weekdaysFullNames.forEach(weekday => {
          const dayHead = document.createElement('div');
          dayHead.textContent = weekday;
          weekdaysGrid.appendChild(dayHead);
        });
        monthCard.appendChild(weekdaysGrid);

        const daysGrid = document.createElement('div');
        daysGrid.className = 'lesson-days-grid';

        for (let i = 0; i < firstDayOfWeek; i++) {
          const emptyCell = document.createElement('div');
          emptyCell.className = 'lesson-day-cell empty';
          daysGrid.appendChild(emptyCell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const isoDate = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const dayTopics = topicsByDate.get(isoDate) || [];
          const hasClass = dayTopics.some(topic => !topic.isNoClass);
          const hasNoClass = dayTopics.some(topic => topic.isNoClass);
          const isOutsideRange = isoDate < range.inicio || isoDate > range.termino;

          const dayCell = document.createElement('div');
          dayCell.className = 'lesson-day-cell';
          if (hasClass) dayCell.classList.add('has-class');
          if (hasNoClass) dayCell.classList.add('has-no-class');
          if (isOutsideRange) dayCell.classList.add('outside-range');
          if (isoDate === todayIsoDate) dayCell.classList.add('is-today');

          const dayNumber = document.createElement('span');
          dayNumber.className = 'lesson-day-number';
          dayNumber.textContent = day;
          dayCell.appendChild(dayNumber);

          if (dayTopics.length > 0) {
            const itemsContainer = document.createElement('div');
            itemsContainer.className = 'lesson-calendar-items';

            dayTopics.forEach(topic => {
              const anchorId = getTopicAnchorId(topic);
              const lessonLabel = getTopicLessonLabel(topic);
              const titleAttr = topic.isNoClass ? topic.title : `${lessonLabel}: ${topic.title}`;
              const item = document.createElement('a');

              item.href = `#${anchorId}`;
              item.className = [
                'lesson-calendar-item',
                topic.dateObj?.isExtra ? 'is-extra' : '',
                topic.isNoClass ? 'is-no-class' : ''
              ].filter(Boolean).join(' ');
              item.setAttribute('aria-label', titleAttr);

              if (!topic.isNoClass) {
                const label = document.createElement('span');
                label.className = 'lesson-calendar-label';
                label.dataset.shortLabel = lessonLabel.replace(/^Aula\s+/, 'A');
                label.textContent = lessonLabel;
                item.appendChild(label);
              }

              const title = document.createElement('span');
              title.className = 'lesson-calendar-title';
              title.textContent = topic.title;
              item.appendChild(title);

              item.addEventListener('click', event => openCalendarLesson(event, anchorId));
              item.addEventListener('mouseenter', event => showLessonCalendarTooltip(event, topic));
              item.addEventListener('mousemove', moveLessonCalendarTooltip);
              item.addEventListener('mouseleave', hideLessonCalendarTooltip);

              itemsContainer.appendChild(item);
            });

            dayCell.appendChild(itemsContainer);
          }

          daysGrid.appendChild(dayCell);
        }

        monthCard.appendChild(daysGrid);
        container.appendChild(monthCard);
      });
    }

    function getLessonCalendarTooltipHtml(topic) {
      const dateText = topic.dateObj
        ? `${topic.dateObj.diaSemana}, ${topic.dateObj.dateStr}`
        : '';
      const labelText = topic.isNoClass
        ? 'Sem aula'
        : `${getTopicLessonLabel(topic)}${topic.dateObj?.isExtra ? ' • Extra' : ''}`;
      const labelClass = topic.isNoClass ? 'lesson-tooltip-label no-class' : 'lesson-tooltip-label';
      const metaText = topic.isNoClass
        ? '0 aulas'
        : `${topic.dateObj?.aulas || 0} aulas`;
      const resourcesCount = topic.resources?.length || 0;
      const resourcesText = resourcesCount > 0
        ? ` • ${resourcesCount} recurso${resourcesCount > 1 ? 's' : ''}`
        : '';

      return `
        <div class="lesson-tooltip-date">${escapeHtml(dateText)}</div>
        <div class="${labelClass}">${escapeHtml(labelText)}</div>
        <div class="lesson-tooltip-title">${escapeHtml(topic.title)}</div>
        <div class="lesson-tooltip-meta">${escapeHtml(metaText + resourcesText)}</div>
      `;
    }

    function showLessonCalendarTooltip(event, topic) {
      if (!calendarTooltipEl) return;

      calendarTooltipEl.innerHTML = getLessonCalendarTooltipHtml(topic);
      calendarTooltipEl.classList.add('active');
      moveLessonCalendarTooltip(event);
    }

    function moveLessonCalendarTooltip(event) {
      if (!calendarTooltipEl) return;

      const tooltipWidth = calendarTooltipEl.offsetWidth || 320;
      const tooltipHeight = calendarTooltipEl.offsetHeight || 120;
      let x = event.clientX + 14;
      let y = event.clientY + 14;

      if (x + tooltipWidth > window.innerWidth - 10) {
        x = event.clientX - tooltipWidth - 14;
      }

      if (y + tooltipHeight > window.innerHeight - 10) {
        y = event.clientY - tooltipHeight - 14;
      }

      calendarTooltipEl.style.left = `${Math.max(10, x)}px`;
      calendarTooltipEl.style.top = `${Math.max(10, y)}px`;
    }

    function hideLessonCalendarTooltip() {
      if (!calendarTooltipEl) return;
      calendarTooltipEl.classList.remove('active');
    }

    function openCalendarLesson(e, anchorId) {
      e.preventDefault();
      hideLessonCalendarTooltip();
      setOutlineView('compact');

      const currentUrl = new URL(window.location.href);
      currentUrl.hash = anchorId;
      window.history.pushState({}, '', currentUrl.toString());

      setTimeout(() => scrollToLesson(anchorId), 50);
    }

    function setOutlineView(mode, options = {}) {
      if (!['compact', 'detailed', 'calendar'].includes(mode)) {
        mode = 'compact';
      }

      const previousMode = currentOutlineView;
      const preservedAnchorId = options.preserveTopLesson
        && previousMode !== 'calendar'
        && mode !== 'calendar'
        ? (options.preservedAnchorId || pendingViewSwitchAnchorId || getTopVisibleLessonAnchorId({ preferAligned: true }) || getUrlLessonAnchor())
        : null;
      pendingViewSwitchAnchorId = null;

      if (mode !== 'calendar') {
        hideLessonCalendarTooltip();
      }

      currentOutlineView = mode;
      if (options.updateUrl !== false) {
        updateQueryString({ view: mode });
      }

      const feed = document.getElementById('outline-feed');
      const calendarContainer = document.getElementById('outline-calendar-container');
      const btnDetailed = document.getElementById('view-detailed-btn');
      const btnCompact = document.getElementById('view-compact-btn');
      const btnCalendar = document.getElementById('view-calendar-btn');

      if (mode === 'compact') {
        feed.style.display = 'flex';
        calendarContainer.style.display = 'none';
        feed.classList.add('compact-mode');
        btnCompact.classList.add('active');
        btnDetailed.classList.remove('active');
        btnCalendar.classList.remove('active');
      } else if (mode === 'detailed') {
        feed.style.display = 'flex';
        calendarContainer.style.display = 'none';
        feed.classList.remove('compact-mode');
        btnDetailed.classList.add('active');
        btnCompact.classList.remove('active');
        btnCalendar.classList.remove('active');
      } else {
        feed.style.display = 'none';
        calendarContainer.style.display = 'grid';
        feed.classList.remove('compact-mode');
        btnCalendar.classList.add('active');
        btnDetailed.classList.remove('active');
        btnCompact.classList.remove('active');
        renderCalendarView();
      }

      if (preservedAnchorId) {
        restoreLessonAtPageTop(preservedAnchorId);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderInlineMarkdown(text) {
      if (!text) return '';
      return escapeHtml(text)
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color: var(--primary); font-weight: 700; text-decoration: underline;">$1</a>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`(.*?)`/g, '<code style="background: #f1f5f9; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-size: 0.85em; font-family: monospace; color: #0369a1;">$1</code>');
    }

    function renderInlineLinks(text) {
      return renderInlineMarkdown(text);
    }

    function copyLessonLink(e, anchorId) {
      e.preventDefault();
      const currentUrl = new URL(window.location.href);
      currentUrl.hash = anchorId;
      window.history.pushState({}, '', currentUrl.toString());

      if (navigator.clipboard) {
        navigator.clipboard.writeText(currentUrl.toString()).then(() => {
          const label = anchorId.startsWith('sem-aula-') ? 'ajuste do cronograma' : `Aula ${anchorId.replace('aula-', '')}`;
          showToast(`🔗 Link para ${label} copiado!`);
        }).catch(() => {});
      }
      scrollToLesson(anchorId);
    }

    function expandCompactLessonCard(card) {
      if (!card) return;
      const feed = document.getElementById('outline-feed');
      if (feed && feed.classList.contains('compact-mode')) {
        feed.querySelectorAll('.topic-card.expanded').forEach(c => {
          if (c !== card) c.classList.remove('expanded');
        });
        card.classList.add('expanded');
      }
    }

    function scrollToLesson(anchorId) {
      const el = document.getElementById(anchorId);
      if (el) {
        expandCompactLessonCard(el);
        requestAnimationFrame(() => {
          scrollElementToPageTop(el, 'smooth');
        });
        el.classList.add('highlight-card');
        setTimeout(() => el.classList.remove('highlight-card'), 2500);
      }
    }

    function getTopVisibleLessonAnchorId(options = {}) {
      if (currentOutlineView === 'calendar') return null;

      const offset = getStickyScrollOffset();
      const cards = Array.from(document.querySelectorAll('#outline-feed .topic-card'));
      const topVisibleCard = cards.find(card => {
        const rect = card.getBoundingClientRect();
        return rect.bottom > offset + 1;
      });
      if (!options.preferAligned) {
        return topVisibleCard?.id || null;
      }

      const alignedCard = cards.find(card => {
        const rect = card.getBoundingClientRect();
        return rect.top >= offset - 4;
      });

      return alignedCard?.id || topVisibleCard?.id || null;
    }

    function rememberTopLessonForViewSwitch() {
      pendingViewSwitchAnchorId = getTopVisibleLessonAnchorId({ preferAligned: true }) || getUrlLessonAnchor();
    }

    function switchOutlineViewPreservingTop(mode) {
      const preservedAnchorId = pendingViewSwitchAnchorId
        || getTopVisibleLessonAnchorId({ preferAligned: true })
        || getUrlLessonAnchor();
      setOutlineView(mode, { preserveTopLesson: true, preservedAnchorId });
    }

    function handleOutlineViewSwitchClick(event, mode) {
      event.preventDefault();
      rememberTopLessonForViewSwitch();
      switchOutlineViewPreservingTop(mode);
    }

    function restoreLessonAtPageTop(anchorId) {
      suspendScrollHashUpdates = true;

      const restore = () => {
        const el = document.getElementById(anchorId);
        if (el) {
          expandCompactLessonCard(el);
          scrollElementToPageTop(el, 'auto');
          updateLessonHash(anchorId);
        }
      };

      requestAnimationFrame(() => {
        requestAnimationFrame(restore);
      });
      setTimeout(restore, 0);
      setTimeout(restore, 80);
      setTimeout(restore, 180);
      setTimeout(() => {
        suspendScrollHashUpdates = false;
        updateHashForTopLesson();
      }, 260);
    }

    function updateOpenGraphMeta({ title, description, url }) {
      if (title) {
        document.title = title;
        const metaTitle = document.querySelector('meta[name="title"]');
        const ogTitle = document.querySelector('meta[property="og:title"]');
        const twTitle = document.querySelector('meta[name="twitter:title"]');
        if (metaTitle) metaTitle.setAttribute('content', title);
        if (ogTitle) ogTitle.setAttribute('content', title);
        if (twTitle) twTitle.setAttribute('content', title);
      }
      if (description) {
        const metaDesc = document.querySelector('meta[name="description"]');
        const ogDesc = document.querySelector('meta[property="og:description"]');
        const twDesc = document.querySelector('meta[name="twitter:description"]');
        if (metaDesc) metaDesc.setAttribute('content', description);
        if (ogDesc) ogDesc.setAttribute('content', description);
        if (twDesc) twDesc.setAttribute('content', description);
      }
      if (url) {
        const ogUrl = document.querySelector('meta[property="og:url"]');
        const twUrl = document.querySelector('meta[name="twitter:url"]');
        if (ogUrl) ogUrl.setAttribute('content', url);
        if (twUrl) twUrl.setAttribute('content', url);
      }
    }

    function updateLessonHash(anchorId) {
      if (!anchorId) return;

      const currentUrl = new URL(window.location.href);
      if (currentUrl.hash !== `#${anchorId}`) {
        currentUrl.hash = anchorId;
        window.history.replaceState(window.history.state || {}, '', currentUrl.toString());
      }

      const lessonEl = document.getElementById(anchorId);
      const discName = document.getElementById('meta-disciplina')?.textContent || 'Plano de Aulas';

      if (!lessonEl) {
        updateOpenGraphMeta({
          title: `${anchorId} • ${discName} | IFPB`,
          url: currentUrl.toString()
        });
        return;
      }

      const lessonLabel = lessonEl.querySelector('.topic-number-link')?.textContent?.trim() || '';
      const topicTitle = lessonEl.querySelector('.topic-title')?.textContent?.trim() || '';
      const topicDate = lessonEl.querySelector('.topic-date-badge')?.textContent?.trim() || '';
      const topicBody = lessonEl.querySelector('.topic-body-text')?.textContent?.trim() || '';

      const fullTitle = lessonLabel
        ? `${lessonLabel}: ${topicTitle} • ${discName} | IFPB`
        : `${topicTitle} • ${discName} | IFPB`;

      const fullDescription = topicDate && topicBody
        ? `${topicDate} — ${topicBody.slice(0, 160)}${topicBody.length > 160 ? '...' : ''}`
        : (topicBody || topicDate || `Plano de aula da disciplina ${discName}`);

      updateOpenGraphMeta({
        title: fullTitle,
        description: fullDescription,
        url: currentUrl.toString()
      });
    }

    function updateHashForTopLesson() {
      scrollHashFrame = null;
      const anchorId = getTopVisibleLessonAnchorId();
      updateLessonHash(anchorId);
    }

    function scheduleHashForTopLessonUpdate() {
      if (suspendScrollHashUpdates || scrollHashFrame !== null || currentOutlineView === 'calendar') return;
      scrollHashFrame = requestAnimationFrame(updateHashForTopLesson);
    }

    function getStickyScrollOffset() {
      updateStickyOffsets();
      const rawOffset = getComputedStyle(document.documentElement)
        .getPropertyValue('--sticky-scroll-offset')
        .trim();
      const parsedOffset = parseFloat(rawOffset);
      return Number.isFinite(parsedOffset) ? parsedOffset : 0;
    }

    function scrollElementToPageTop(el, behavior = 'smooth') {
      if (!el) return;

      const offset = getStickyScrollOffset();
      const targetTop = Math.max(0, window.scrollY + el.getBoundingClientRect().top - offset);
      window.scrollTo({ top: targetTop, behavior });
    }

    function updateStickyOffsets() {
      const header = document.querySelector('header');
      const stickyTools = document.querySelector('.sticky-page-tools');
      const headerHeight = header ? header.getBoundingClientRect().height : 0;
      const headerIsSticky = header ? getComputedStyle(header).position === 'sticky' : false;
      const stickyHeaderHeight = headerIsSticky ? headerHeight : 0;
      const stickyToolsHeight = stickyTools ? stickyTools.getBoundingClientRect().height : 0;
      const lessonTopGap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lesson-top-gap')) || 24;
      const offset = Math.ceil(stickyHeaderHeight + stickyToolsHeight + lessonTopGap);

      document.documentElement.style.setProperty('--sticky-tools-top', `${Math.ceil(stickyHeaderHeight)}px`);
      document.documentElement.style.setProperty('--sticky-scroll-offset', `${offset}px`);
    }

    function getUrlLessonAnchor() {
      const hash = window.location.hash.replace('#', '').trim();
      const urlParams = new URLSearchParams(window.location.search);
      const aulaParam = urlParams.get('aula') || urlParams.get('lesson');

      if (hash && (hash.startsWith('aula-') || hash.startsWith('sem-aula-'))) {
        return hash;
      }

      if (aulaParam) {
        return `aula-${String(aulaParam).padStart(2, '0')}`;
      }

      return null;
    }

    function checkUrlAnchor() {
      const targetId = getUrlLessonAnchor();
      if (targetId) {
        updateLessonHash(targetId);
        setTimeout(() => scrollToLesson(targetId), 400);
        return true;
      }

      return false;
    }

    function scrollFocusedLessonToTop() {
      if (currentOutlineView === 'calendar') return;

      const focusBadge = document.querySelector('.topic-date-badge.is-focus-date');
      const focusCard = focusBadge ? focusBadge.closest('.topic-card') : null;
      if (focusCard) {
        expandCompactLessonCard(focusCard);
        scrollElementToPageTop(focusCard, 'auto');
        updateLessonHash(focusCard.id);
      }
    }

    function showToast(message) {
      let toast = document.getElementById('toast-notification');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toast-notification';
        toast.className = 'toast-notification';
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 3000);
    }

    // Init Event Listeners
    const subjectSelectEl = document.getElementById('subject-select');
    if (subjectSelectEl) {
      subjectSelectEl.addEventListener('change', (e) => {
        const selectedValue = e.target.value;
        if (!selectedValue) {
          updateQueryString({}, { deleteParams: ['subject', 'file'], clearHash: true });
          loadSubjectOutline();
        } else {
          updateQueryString({ subject: selectedValue }, { deleteParams: ['file'], clearHash: true });
          loadSubjectOutline(getSubjectFileFromSlug(selectedValue));
        }
      });
    }

    document.getElementById('search-input').addEventListener('input', renderTopics);

    document.getElementById('view-detailed-btn').addEventListener('pointerdown', rememberTopLessonForViewSwitch);
    document.getElementById('view-compact-btn').addEventListener('pointerdown', rememberTopLessonForViewSwitch);
    document.getElementById('view-detailed-btn').addEventListener('click', event => handleOutlineViewSwitchClick(event, 'detailed'));
    document.getElementById('view-compact-btn').addEventListener('click', event => handleOutlineViewSwitchClick(event, 'compact'));
    document.getElementById('view-calendar-btn').addEventListener('click', () => setOutlineView('calendar'));
    const headerTitleLink = document.querySelector('.header-title-link');
    if (headerTitleLink) {
      headerTitleLink.addEventListener('click', (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('subjects-theme', next);
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const btn = document.getElementById('theme-toggle-btn');
      if (!btn) return;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.innerHTML = isDark ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
      btn.setAttribute('title', isDark ? 'Mudar para Tema Claro' : 'Mudar para Tema Escuro');
      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('theme-toggle-btn')?.addEventListener('click', toggleTheme);
    updateThemeIcon();

    function handleLessonKeyboardNavigation(e) {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      if (currentOutlineView === 'calendar') return;

      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable)) {
        return;
      }

      const cards = Array.from(document.querySelectorAll('#outline-feed .topic-card'));
      if (cards.length === 0) return;

      let currentIndex = -1;
      const feed = document.getElementById('outline-feed');
      if (feed && feed.classList.contains('compact-mode')) {
        currentIndex = cards.findIndex(c => c.classList.contains('expanded'));
      }

      if (currentIndex === -1) {
        const topAnchorId = getTopVisibleLessonAnchorId({ preferAligned: true }) || getTopVisibleLessonAnchorId();
        if (topAnchorId) {
          currentIndex = cards.findIndex(c => c.id === topAnchorId);
        }
      }

      let targetIndex = currentIndex;
      if (e.key === 'ArrowDown') {
        targetIndex = currentIndex === -1 ? 0 : Math.min(cards.length - 1, currentIndex + 1);
      } else if (e.key === 'ArrowUp') {
        targetIndex = currentIndex === -1 ? 0 : Math.max(0, currentIndex - 1);
      }

      if (targetIndex >= 0 && targetIndex < cards.length && targetIndex !== currentIndex) {
        e.preventDefault();
        const targetCard = cards[targetIndex];
        scrollToLesson(targetCard.id);
      }
    }

    document.getElementById('jump-current-lesson-btn').addEventListener('click', jumpToTodayOrNextLesson);
    window.addEventListener('keydown', handleLessonKeyboardNavigation);
    window.addEventListener('scroll', scheduleHashForTopLessonUpdate, { passive: true });
    window.addEventListener('resize', updateStickyOffsets);

    const headerDetailsEl = document.getElementById('header-details-info');
    if (headerDetailsEl) {
      if (window.innerWidth <= 768) {
        headerDetailsEl.removeAttribute('open');
      }
      headerDetailsEl.addEventListener('toggle', updateStickyOffsets);
    }

    // Start App
    updateStickyOffsets();
    const initialFile = getSelectedSubjectFile();
    loadSubjectOutline(initialFile);
  </script>
</body>
</html>
